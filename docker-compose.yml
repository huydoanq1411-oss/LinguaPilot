services:
  db:
    image: postgres:16-alpine
    container_name: lp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Cổng máy host 5434 được chuyển tiếp tới cổng PostgreSQL mặc định 5432.
      - "5434:5432"
    # Volume có tên giữ dữ liệu DB sau khi container dừng hoặc được tạo lại.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # pgAdmin chờ DB sẵn sàng trước khi khởi động.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
